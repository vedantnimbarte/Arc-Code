# Detached from the root workspace on purpose — see
# docs/decisions/0018-the-notifier-is-not-a-workspace-member.md. The empty
# `[workspace]` table below is what roots this crate independently; the root
# manifest also lists it under `exclude`.
#
# It deliberately does not depend on `wingman-config`, which would drag
# `keyring` (and libsecret/D-Bus on Linux) into a binary whose whole point is
# being cheap to build. The ~90 lines of wire format and tailing it needs are
# copied instead, pinned on both sides by an identical shape assertion.
[workspace]

[package]
name = "wingman-notify"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/vedantnimbarte/Wingman"
description = "Desktop notification popups for wingman"

# Tauri's dev/production switch, and it is not the cargo profile: without
# `custom-protocol` the binary serves its window from `devUrl` — the Vite dev
# server on :1421 — instead of the assets `generate_context!` embedded. A build
# without it shows `ERR_CONNECTION_REFUSED` in a window that then never calls
# `resize`, so the popup stays hidden forever and looks like it did nothing.
#
# The `tauri build` CLI passes this flag itself. Nothing here uses that CLI —
# `wingman notify` and CI both run plain `cargo build` — so it has to be on by
# default, and `--no-default-features` is what selects the dev-server build.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

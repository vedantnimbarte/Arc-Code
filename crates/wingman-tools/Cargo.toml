[package]
name = "wingman-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in tools (file/shell/search) for wingman"

[dependencies]
wingman-core = { workspace = true }
wingman-config = { workspace = true }
wingman-rag = { workspace = true, default-features = false }
wingman-learn = { workspace = true }
wingman-skills = { workspace = true }
wingman-session = { workspace = true }
wingman-lsp = { workspace = true }
wingman-ts = { workspace = true, optional = true }
# Text extraction only: a spec or design doc handed over as a PDF is ordinary
# coding context, and the alternative is the model being told "refusing to
# read binary file".
#
# The 0.12 floor is a security floor, not a feature one: earlier releases pin
# `lopdf` 0.36, which RUSTSEC-2026-0187 reports as a stack overflow on deeply
# nested PDF objects — unbounded recursion, so it aborts rather than panicking
# and `catch_unwind` in `read_file` cannot contain it. 0.12 carries `lopdf`
# >= 0.42, where the recursion is bounded.
pdf-extract = { version = "0.12", optional = true }

tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

ignore = "0.4"
globset = "0.4"
regex = "1"
similar = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
urlencoding = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Process-group signalling, for `child_process`'s tree-kill.
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = ["treesitter", "pdf"]
treesitter = ["dep:wingman-ts", "wingman-ts/treesitter"]
# Text extraction from PDFs in `read_file`. Pure Rust, so unlike `treesitter`
# it needs no C toolchain — gated only so a build that will never be handed a
# PDF need not carry the parser.
pdf = ["dep:pdf-extract"]


[dev-dependencies]
tempfile = "3"
# `start_paused` — lets the deadline tests advance the clock instead of
# actually waiting out a 30s sleep.
tokio = { workspace = true, features = ["test-util"] }

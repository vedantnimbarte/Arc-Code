[workspace]
resolver = "2"
members = [
    "crates/wingman-cli",
    "crates/wingman-config",
    "crates/wingman-core",
    "crates/wingman-tui",
    "crates/wingman-providers",
    "crates/wingman-tools",
    "crates/wingman-session",
    "crates/wingman-rag",
    "crates/wingman-mcp",
    "crates/wingman-skills",
    "crates/wingman-learn",
    "crates/wingman-ts",
    "crates/wingman-autonomous",
    "crates/wingman-lsp",
    "crates/wingman-browser",
    "crates/wingman-board",
]

# `desktop/notifier` is a Tauri app with its own `[workspace]` table and its own
# Cargo.lock — the arrangement `editors/vscode` already has for npm. Excluded
# rather than made a member because `--workspace` ignores `default-members`:
# `matrix-test`, `msrv` and the *required* `audit` job would then all need
# libwebkit2gtk on the runner, and every advisory anywhere in the webview tree
# would turn a required gate red. Build it with `--manifest-path`.
# See docs/decisions/0018-the-notifier-is-not-a-workspace-member.md.
exclude = ["desktop/notifier"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/vedantnimbarte/Wingman"
authors = ["wingman contributors"]

[workspace.dependencies]
wingman-cli = { path = "crates/wingman-cli", version = "0.4.0" }
wingman-config = { path = "crates/wingman-config", version = "0.4.0" }
wingman-core = { path = "crates/wingman-core", version = "0.4.0" }
wingman-tui = { path = "crates/wingman-tui", version = "0.4.0" }
wingman-providers = { path = "crates/wingman-providers", version = "0.4.0" }
wingman-tools = { path = "crates/wingman-tools", version = "0.4.0" }
wingman-session = { path = "crates/wingman-session", version = "0.4.0" }
wingman-rag = { path = "crates/wingman-rag", version = "0.4.0", default-features = false }
wingman-mcp = { path = "crates/wingman-mcp", version = "0.4.0" }
wingman-skills = { path = "crates/wingman-skills", version = "0.4.0" }
wingman-learn = { path = "crates/wingman-learn", version = "0.4.0" }
wingman-ts = { path = "crates/wingman-ts", version = "0.4.0", default-features = false }
wingman-autonomous = { path = "crates/wingman-autonomous", version = "0.4.0" }
wingman-lsp = { path = "crates/wingman-lsp", version = "0.4.0" }
wingman-browser = { path = "crates/wingman-browser", version = "0.4.0", default-features = false }
wingman-board = { path = "crates/wingman-board", version = "0.4.0" }

tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "signal", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

thiserror = "2"
anyhow = "1"

# Optional, behind wingman-config's `schema` feature. Lifts the config
# structs' doc comments into a JSON Schema for the web panel's settings forms.
# Only wingman-cli turns it on; the other twelve crates that depend on
# wingman-config never build it.
schemars = { version = "0.8", default-features = false, features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

clap = { version = "4", features = ["derive", "env"] }
directories = "5"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

rand = "0.10"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"

[profile.dev]
# Windows MSVC hits a 4 GB PDB cap (LNK1318) when the workspace grows.
# `line-tables-only` keeps backtraces useful while staying under the limit.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
